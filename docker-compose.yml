version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vllm-ingest:
    image: vllm/vllm-openai:v0.27.0
    ports:
      - "8000:8000"
    environment:
      - VLLM_USE_RUST_FRONTEND=1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - model_cache:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen3.5-9B-FP8-dynamic
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --enable-chunked-prefill
      --reasoning-parser qwen3
      --max-model-len 16384
      --max-num-seqs 32
      --gpu-memory-utilization 0.50
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  vllm-answer:
    image: vllm/vllm-openai:v0.27.0
    ports:
      - "8001:8000"
    environment:
      - VLLM_USE_RUST_FRONTEND=1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - model_cache:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen3.5-4B-FP8-dynamic
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-model-len 12288
      --max-num-seqs 64
      --gpu-memory-utilization 0.40
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  vllm-ocr:
    image: unlimited-ocr/vllm:latest
    profiles: ["ocr"]
    ports:
      - "8002:8000"
    environment:
      - VLLM_USE_RUST_FRONTEND=1
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vllm-ingest:
        condition: service_healthy
      vllm-answer:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  model_cache: